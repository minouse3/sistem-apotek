{{define "content"}}
{{if .Pesan}}<p class="app-flash" role="status">{{.Pesan}}</p>{{end}}
<div class="page-head">
  <div class="page-heading">
    <p class="page-eyebrow">MASTER DATA</p>
    <h1>Ubah satuan</h1>
  </div>
</div>

<form class="panel form-panel" method="post" action="/satuan/{{.ID}}/ubah" novalidate>
  <label class="form-label" for="nama_satuan">Nama satuan</label>
  <input class="form-control{{if .Error}} is-invalid{{end}}" id="nama_satuan" name="nama_satuan" value="{{.Nama}}"
    maxlength="50" aria-describedby="nama_satuan-help{{if .Error}} nama_satuan-error{{end}}">
  <p class="field-help" id="nama_satuan-help">Nama baru langsung berlaku untuk semua obat yang memakai satuan ini.</p>
  {{with .Error}}<p class="field-error" id="nama_satuan-error">{{.}}</p>{{end}}

  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Simpan perubahan</button>
    <a class="btn btn-outline-secondary" href="/satuan">Batal</a>
  </div>
</form>
{{end}}
